# Mtrip 本地一键联调环境(Windows Docker Desktop 兼容)
# 用法:cd deploy; Copy-Item .env.example .env; docker compose up -d --build
# 网关入口:http://localhost:8081(/api/v1/admin/* 与 /api/v1/app/* 统一分发;8080 易被占用)
name: mtrip

x-hyperf-common: &hyperf-common
  restart: unless-stopped
  environment: &hyperf-env
    APP_ENV: ${APP_ENV:-dev}
    # 注解缓存:开发 false(改注解重启即生效),生产必须 true(避坑规范 三.4)
    SCAN_CACHEABLE: ${SCAN_CACHEABLE:-false}
    WORKER_NUM: "2"
    # worker 处理 N 个请求后平滑重建,防内存泄漏(避坑规范 三.1)
    MAX_REQUEST: ${MAX_REQUEST:-10000}
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_BUSINESS_DATABASE: mtrip_business
    DB_SYSTEM_DATABASE: mtrip_system
    DB_USERNAME: ${MYSQL_USER:-mtrip}
    DB_PASSWORD: ${MYSQL_PASSWORD:-mtrip@2026}
    DB_MAX_CONNECTIONS: "10"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_AUTH: ""
    REDIS_DB: "0"
    MTRIP_JWT_SECRET: ${MTRIP_JWT_SECRET:-mtrip-dev-jwt-secret-change-me}
    MTRIP_JWT_TTL: "7200"
    MTRIP_APP_JWT_TTL: "604800"
    MTRIP_AES_KEY: ${MTRIP_AES_KEY:-mtrip-dev-aes-key-change-me}
    # 全量请求日志开关(排查模式:请求/响应/异常写 request.log,生产保持 false)
    MTRIP_REQUEST_LOG: ${MTRIP_REQUEST_LOG:-false}
    # 客户端签名鉴权(app 接口 HMAC-SHA256,生产必须 true;时间窗口秒)
    MTRIP_CLIENT_SIGN: ${MTRIP_CLIENT_SIGN:-true}
    MTRIP_SIGN_TTL: ${MTRIP_SIGN_TTL:-3600}
    # 敏感接口传输加密(登录/注册强制 AES 加密,生产必须 true)
    MTRIP_PAYLOAD_ENCRYPT: ${MTRIP_PAYLOAD_ENCRYPT:-true}
    # 管理端登录传输加密密钥(与 admin-web VITE_LOGIN_AES_KEY 同值)
    MTRIP_ADMIN_AES_KEY: ${MTRIP_ADMIN_AES_KEY:-}
    # 提交防重(写操作 Redis 并发锁/X-Form-Id 幂等,锁兜底 TTL 与幂等窗口单位秒)
    MTRIP_SUBMIT_LOCK: ${MTRIP_SUBMIT_LOCK:-true}
    MTRIP_SUBMIT_LOCK_TTL: ${MTRIP_SUBMIT_LOCK_TTL:-10}
    MTRIP_FORM_ID_TTL: ${MTRIP_FORM_ID_TTL:-300}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root@2026}
      MYSQL_USER: ${MYSQL_USER:-mtrip}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mtrip@2026}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 注意:不再挂载 charset.cnf。Docker Desktop(Windows)会把挂载文件映射为 world-writable,
      # 导致 MySQL 忽略该配置并报警告,实际并未生效;客户端字符集改由每个 init SQL 文件首行的
      # `SET NAMES utf8mb4;` 统一保证(已全量覆盖),无需依赖挂载文件。
      # 首次启动自动建库建表+种子(按文件名顺序执行;重建需 docker compose down -v)
      - ../database/init/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ../database/system/01-admin-role-menu.sql:/docker-entrypoint-initdb.d/10-system-admin-role-menu.sql:ro
      - ../database/system/02-log.sql:/docker-entrypoint-initdb.d/11-system-log.sql:ro
      - ../database/system/03-config-site.sql:/docker-entrypoint-initdb.d/12-system-config-site.sql:ro
      - ../database/system/04-storage-file.sql:/docker-entrypoint-initdb.d/13-system-storage-file.sql:ro
      - ../database/system/05-pay-sms-map.sql:/docker-entrypoint-initdb.d/14-system-pay-sms-map.sql:ro
      - ../database/system/06-client.sql:/docker-entrypoint-initdb.d/15-system-client.sql:ro
      - ../database/merchant/01-merchant.sql:/docker-entrypoint-initdb.d/20-merchant.sql:ro
      - ../database/merchant/02-supplier.sql:/docker-entrypoint-initdb.d/21-supplier.sql:ro
      # 集团/门店 + 商户账号类型 + 商户/供应商 RBAC(依赖 20/21 的基础表,须在其后)
      - ../database/merchant/03-group-store.sql:/docker-entrypoint-initdb.d/22-merchant-group-store.sql:ro
      - ../database/merchant/04-admin-account-type.sql:/docker-entrypoint-initdb.d/23-merchant-admin-account-type.sql:ro
      - ../database/merchant/05-merchant-rbac.sql:/docker-entrypoint-initdb.d/24-merchant-rbac.sql:ro
      - ../database/merchant/06-supplier-rbac.sql:/docker-entrypoint-initdb.d/25-supplier-rbac.sql:ro
      - ../database/seed/04-merchant-menu.sql:/docker-entrypoint-initdb.d/26-seed-merchant-menu.sql:ro
      - ../database/seed/05-supplier-menu.sql:/docker-entrypoint-initdb.d/27-seed-supplier-menu.sql:ro
      # 商户验证工作流(Super Admin Portal Phase 1,依赖 20-merchant 基础表)
      - ../database/merchant/07-verify-workflow.sql:/docker-entrypoint-initdb.d/28-merchant-verify-workflow.sql:ro
      # 商户入驻流水线(原型对齐整改,依赖 28 的 doc/timeline 表 ALTER)
      - ../database/merchant/09-merchant-application.sql:/docker-entrypoint-initdb.d/29-merchant-application.sql:ro
      # 商户账户安全(2FA 字段,整改 A3/B3,依赖 29 的 reject_reason_code 列)
      - ../database/merchant/10-merchant-account-security.sql:/docker-entrypoint-initdb.d/30-merchant-account-security.sql:ro
      - ../database/goods/01-goods.sql:/docker-entrypoint-initdb.d/31-goods.sql:ro
      # 商户管理整改 Phase B:通知中心 / KYC 确认状态位 / 代入会话
      - ../database/merchant/11-merchant-notify.sql:/docker-entrypoint-initdb.d/32-merchant-notify.sql:ro
      - ../database/merchant/12-merchant-confirmation.sql:/docker-entrypoint-initdb.d/33-merchant-confirmation.sql:ro
      - ../database/merchant/13-merchant-impersonation.sql:/docker-entrypoint-initdb.d/34-merchant-impersonation.sql:ro
      # 商户管理整改 Phase C:Marketplace Ranking(商家/目的地/审计 + demo 种子)
      - ../database/merchant/14-merchant-ranking.sql:/docker-entrypoint-initdb.d/35-merchant-ranking.sql:ro
      # 正式 PRD v1.0 整改:商户验证与审批(五队列/业务联系方式/访问码日志/2FA状态/重交标记/拒绝快照)
      - ../database/merchant/15-merchant-verify-rework.sql:/docker-entrypoint-initdb.d/36-merchant-verify-rework.sql:ro
      # 最新原型 v4.2.1:Merchant Verification 四队列线索视图(线索重交标记)
      - ../database/merchant/16-merchant-onboarding-queues.sql:/docker-entrypoint-initdb.d/37-merchant-onboarding-queues.sql:ro
      # 最新原型 v4.2.1:入驻阶段流程节点 4 → 6(stage 4→5, 5→6, 6→7)
      - ../database/merchant/17-merchant-onboarding-stages.sql:/docker-entrypoint-initdb.d/38-merchant-onboarding-stages.sql:ro
      # 最新原型 v4.2.1:废弃重交标记列(stage 4 承担等待文件,存量迁移后清理)
      - ../database/merchant/18-merchant-onboarding-resubmit-cleanup.sql:/docker-entrypoint-initdb.d/39-merchant-onboarding-resubmit-cleanup.sql:ro
      # 最新原型 v4.2.1:线索档案字段(商家名称/城市/地址)
      - ../database/merchant/19-merchant-onboarding-profile.sql:/docker-entrypoint-initdb.d/39a-merchant-onboarding-profile.sql:ro
      # 最新原型 v4.2.1:业务单元级 KYC 配置(KYC Management 按注册企业卡片切换)
      - ../database/merchant/20-merchant-business-kyc.sql:/docker-entrypoint-initdb.d/39b-merchant-business-kyc.sql:ro
      # 最新原型 stir-long:入驻阶段回归四节点流程(stage 5→4, 6→5, 7→6)
      - ../database/merchant/21-merchant-onboarding-stages-v2.sql:/docker-entrypoint-initdb.d/39c-merchant-onboarding-stages-v2.sql:ro
      # Merchant App M6:商户端通知已读状态
      - ../database/merchant/22-merchant-web-notify-read.sql:/docker-entrypoint-initdb.d/39d-merchant-web-notify-read.sql:ro
      # 注册业务单元 KYC 状态流转:待办中→待核验→审核中→已验证
      - ../database/merchant/23-merchant-kyc-status-flow.sql:/docker-entrypoint-initdb.d/39e-merchant-kyc-status-flow.sql:ro
      # KYC 正式提交边界:上传仅保存草稿,提交核验后才进入待核验
      - ../database/merchant/24-merchant-kyc-submit-boundary.sql:/docker-entrypoint-initdb.d/39f-merchant-kyc-submit-boundary.sql:ro
      # 公司注册号有效记录全平台唯一(空值、软删除记录不占用)
      - ../database/merchant/25-merchant-application-reg-number-unique.sql:/docker-entrypoint-initdb.d/39g-merchant-application-reg-number-unique.sql:ro
      # 入驻线索创建即生成唯一商户业务编号 MCH-XXXX，并贯穿正式商户
      - ../database/merchant/26-merchant-code.sql:/docker-entrypoint-initdb.d/39h-merchant-code.sql:ro
      - ../database/merchant/27-merchant-status.sql:/docker-entrypoint-initdb.d/39i-merchant-status.sql:ro
      - ../database/merchant/28-merchant-directory-property.sql:/docker-entrypoint-initdb.d/39j-merchant-directory-property.sql:ro
      - ../database/merchant/29-merchant-documents-notifications.sql:/docker-entrypoint-initdb.d/39k-merchant-documents-notifications.sql:ro
      - ../database/merchant/30-merchant-account-security.sql:/docker-entrypoint-initdb.d/39l-merchant-account-security.sql:ro
      - ../database/merchant/31-merchant-marketplace.sql:/docker-entrypoint-initdb.d/39m-merchant-marketplace.sql:ro
      - ../database/order/01-order.sql:/docker-entrypoint-initdb.d/40-order.sql:ro
      - ../database/order/02-verify.sql:/docker-entrypoint-initdb.d/41-verify.sql:ro
      - ../database/finance/01-finance.sql:/docker-entrypoint-initdb.d/50-finance.sql:ro
      - ../database/marketing/01-marketing.sql:/docker-entrypoint-initdb.d/60-marketing.sql:ro
      - ../database/user/01-user.sql:/docker-entrypoint-initdb.d/70-user.sql:ro
      - ../database/user/02-user-app.sql:/docker-entrypoint-initdb.d/71-user-app.sql:ro
      # Consumer App PRD v1.0 增量迁移(在基础表之后、种子之前执行)
      - ../database/goods/02-consumer-dualprice.sql:/docker-entrypoint-initdb.d/80-consumer-goods-dualprice.sql:ro
      - ../database/order/03-consumer-booking.sql:/docker-entrypoint-initdb.d/81-consumer-order-booking.sql:ro
      - ../database/marketing/02-consumer-longstay.sql:/docker-entrypoint-initdb.d/82-consumer-longstay.sql:ro
      - ../database/user/03-consumer-traveler.sql:/docker-entrypoint-initdb.d/83-consumer-traveler.sql:ro
      - ../database/goods/03-consumer-review.sql:/docker-entrypoint-initdb.d/84-consumer-review.sql:ro
      - ../database/user/04-consumer-favorite.sql:/docker-entrypoint-initdb.d/85-consumer-favorite.sql:ro
      - ../database/user/05-consumer-referral.sql:/docker-entrypoint-initdb.d/86-consumer-referral.sql:ro
      - ../database/user/06-consumer-notify.sql:/docker-entrypoint-initdb.d/87-consumer-notify.sql:ro
      - ../database/system/07-app-theme.sql:/docker-entrypoint-initdb.d/88-consumer-app-theme.sql:ro
      - ../database/user/07-consumer-fraud-appeal.sql:/docker-entrypoint-initdb.d/89-consumer-fraud-appeal.sql:ro
      - ../database/seed/01-admin-role.sql:/docker-entrypoint-initdb.d/90-seed-admin-role.sql:ro
      - ../database/seed/02-menu.sql:/docker-entrypoint-initdb.d/91-seed-menu.sql:ro
      - ../database/seed/03-config-site.sql:/docker-entrypoint-initdb.d/92-seed-config-site.sql:ro
      # 结算出资分账(与种子无依赖,置于末尾)
      - ../database/marketing/03-consumer-funding.sql:/docker-entrypoint-initdb.d/93-consumer-funding.sql:ro
      - ../database/finance/02-consumer-account-entry.sql:/docker-entrypoint-initdb.d/94-consumer-account-entry.sql:ro
      - ../database/user/08-consumer-chat.sql:/docker-entrypoint-initdb.d/95-consumer-chat.sql:ro
      - ../database/order/04-consumer-trip.sql:/docker-entrypoint-initdb.d/96-consumer-trip.sql:ro
      - ../database/goods/05-merchant-review-flag.sql:/docker-entrypoint-initdb.d/96a-merchant-review-flag.sql:ro
      - ../database/goods/06-merchant-room-availability-fields.sql:/docker-entrypoint-initdb.d/96b-merchant-room-availability-fields.sql:ro
      - ../database/goods/04-consumer-filter.sql:/docker-entrypoint-initdb.d/97-consumer-filter.sql:ro
      - ../database/marketing/04-consumer-campaign.sql:/docker-entrypoint-initdb.d/98-consumer-campaign.sql:ro
      # 带货达人与联盟(Super Admin Portal Phase 2)
      - ../database/marketing/05-affiliate.sql:/docker-entrypoint-initdb.d/99-affiliate.sql:ro
      # 终端用户黑名单(Super Admin Portal Phase 3)
      - ../database/user/09-enduser-blacklist.sql:/docker-entrypoint-initdb.d/99b-enduser-blacklist.sql:ro
      # 帮助中心(Super Admin Portal)
      - ../database/system/08-helpcenter.sql:/docker-entrypoint-initdb.d/99c-helpcenter.sql:ro
      # 平台规则与合规(模块08)+ 促销独立实体(模块05)
      - ../database/merchant/08-compliance.sql:/docker-entrypoint-initdb.d/99d-compliance.sql:ro
      - ../database/merchant/32-merchant-compliance.sql:/docker-entrypoint-initdb.d/99d1-merchant-compliance.sql:ro
      - ../database/marketing/06-promotion-extras.sql:/docker-entrypoint-initdb.d/99e-promotion-extras.sql:ro
      - ../database/marketing/07-merchant-promotion-owner.sql:/docker-entrypoint-initdb.d/99e1-merchant-promotion-owner.sql:ro
      # 平台特性开关(模块11)
      - ../database/system/09-feature-flag.sql:/docker-entrypoint-initdb.d/99f-feature-flag.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root@2026}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  system-service:
    <<: *hyperf-common
    build:
      context: ../backend
      dockerfile: services/system-service/Dockerfile
    environment:
      <<: *hyperf-env
      HTTP_PORT: "9501"
    ports:
      - "9501:9501"

  user-service:
    <<: *hyperf-common
    build:
      context: ../backend
      dockerfile: services/user-service/Dockerfile
    environment:
      <<: *hyperf-env
      HTTP_PORT: "9502"
    ports:
      - "9502:9502"

  goods-service:
    <<: *hyperf-common
    build:
      context: ../backend
      dockerfile: services/goods-service/Dockerfile
    environment:
      <<: *hyperf-env
      HTTP_PORT: "9503"
    ports:
      - "9503:9503"

  order-service:
    <<: *hyperf-common
    build:
      context: ../backend
      dockerfile: services/order-service/Dockerfile
    environment:
      <<: *hyperf-env
      HTTP_PORT: "9504"
    ports:
      - "9504:9504"

  merchant-service:
    <<: *hyperf-common
    build:
      context: ../backend
      dockerfile: services/merchant-service/Dockerfile
    environment:
      <<: *hyperf-env
      HTTP_PORT: "9505"
    ports:
      - "9505:9505"
    volumes:
      - ./uploads:/opt/www/uploads

  finance-service:
    <<: *hyperf-common
    build:
      context: ../backend
      dockerfile: services/finance-service/Dockerfile
    environment:
      <<: *hyperf-env
      HTTP_PORT: "9506"
    ports:
      - "9506:9506"

  marketing-service:
    <<: *hyperf-common
    build:
      context: ../backend
      dockerfile: services/marketing-service/Dockerfile
    environment:
      <<: *hyperf-env
      HTTP_PORT: "9507"
    ports:
      - "9507:9507"

  payment-service:
    <<: *hyperf-common
    build:
      context: ../backend
      dockerfile: services/payment-service/Dockerfile
    environment:
      <<: *hyperf-env
      HTTP_PORT: "9508"
    ports:
      - "9508:9508"

  gateway:
    image: openresty/openresty:1.25.3.1-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_HOST_PORT:-8081}:80"
    volumes:
      - ./openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./openresty/conf.d:/etc/nginx/conf.d:ro
      - ./uploads:/usr/local/openresty/nginx/static/uploads:ro
    depends_on:
      - system-service
      - user-service
      - goods-service
      - order-service
      - merchant-service
      - finance-service
      - marketing-service
      - payment-service

volumes:
  mysql-data:
  redis-data:
