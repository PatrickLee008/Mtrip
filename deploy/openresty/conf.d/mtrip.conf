# Mtrip 网关路由:按 /api/v1/admin/{svc} 与 /api/v1/app/{svc} 分发到 9501~9508
# 服务端已带 CorsMiddleware,网关对 OPTIONS 预检直接应答,其余透传由服务补 CORS 头

# ---------- 上游服务(compose 服务名解析) ----------
upstream system_service    { server system-service:9501;    keepalive 16; }
upstream user_service      { server user-service:9502;      keepalive 16; }
upstream goods_service     { server goods-service:9503;     keepalive 16; }
upstream order_service     { server order-service:9504;     keepalive 16; }
upstream merchant_service  { server merchant-service:9505;  keepalive 16; }
upstream finance_service   { server finance-service:9506;   keepalive 16; }
upstream marketing_service { server marketing-service:9507; keepalive 16; }
upstream payment_service   { server payment-service:9508;   keepalive 16; }

# ---------- 管理端路由表:/api/v1/admin/{module} → 上游 ----------
map $admin_module $admin_upstream {
    default    "";
    auth       system_service;
    sys        system_service;
    site       system_service;
    client     system_service;
    merchant   merchant_service;
    supplier   merchant_service;
    goods      goods_service;
    order      order_service;
    finance    finance_service;
    user       user_service;
    marketing  marketing_service;
}

# ---------- 移动端路由表:/api/v1/app/{module} → 上游 ----------
map $app_module $app_upstream {
    default  "";
    site     system_service;
    auth     user_service;
    user     user_service;
    goods    goods_service;
    order    order_service;
}

# ---------- 商家端路由表:/api/v1/merchant/{module} → 上游 ----------
map $merchant_module $merchant_upstream {
    default  "";
    auth     merchant_service;
    account  merchant_service;
    role     merchant_service;
    store    merchant_service;
    order    order_service;
    goods    goods_service;
}

# ---------- 供应商端路由表:/api/v1/supplier/{module} → 上游 ----------
map $supplier_module $supplier_upstream {
    default  "";
    auth     merchant_service;
    account  merchant_service;
    role     merchant_service;
    goods    merchant_service;
    settle   merchant_service;
}

server {
    listen 80;
    server_name _;

    # 统一错误 JSON(与后端 {code,message,data} 规范一致)
    error_page 404 = @not_found;
    error_page 429 = @too_many;
    error_page 500 502 503 504 = @upstream_error;

    location @not_found {
        default_type application/json;
        return 404 '{"code":40400,"message":"resource not found","data":null}';
    }
    location @too_many {
        default_type application/json;
        return 429 '{"code":42900,"message":"too many requests","data":null}';
    }
    location @upstream_error {
        default_type application/json;
        return 502 '{"code":50200,"message":"upstream service unavailable","data":null}';
    }

    # 网关探活
    location = /healthz {
        default_type application/json;
        return 200 '{"code":0,"message":"ok","data":{"gateway":"openresty"}}';
    }

    # CORS 预检需在 location 内应答(server 层 return 不会带 location 的 add_header),
    # 各 API location 统一 add_header + OPTIONS 204;后端 CorsMiddleware 的头由 proxy_hide_header 剥除防重复

    # ---------- 管理端:/api/v1/admin/{module}/... ----------
    location ~ ^/api/v1/admin/(?<admin_module>[a-z-]+)(/|$) {
        if ($admin_upstream = "") { return 404; }

        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With, X-Encrypted' always;
        add_header Access-Control-Max-Age 86400 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=api_limit burst=60 nodelay;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://$admin_upstream;
    }

    # ---------- 移动端:/api/v1/app/{module}/... ----------
    location ~ ^/api/v1/app/(?<app_module>[a-z-]+)(/|$) {
        if ($app_upstream = "") { return 404; }

        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Site-Id, X-Client-Type, X-Lang, X-Client-Id, X-Timestamp, X-Nonce, X-Sign, X-Encrypted' always;
        add_header Access-Control-Max-Age 86400 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=api_limit burst=60 nodelay;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://$app_upstream;
    }

    # ---------- 商家端:/api/v1/merchant/{module}/... ----------
    location ~ ^/api/v1/merchant/(?<merchant_module>[a-z-]+)(/|$) {
        if ($merchant_upstream = "") { return 404; }

        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With, X-Encrypted' always;
        add_header Access-Control-Max-Age 86400 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=api_limit burst=60 nodelay;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://$merchant_upstream;
    }

    # ---------- 供应商端:/api/v1/supplier/{module}/... ----------
    location ~ ^/api/v1/supplier/(?<supplier_module>[a-z-]+)(/|$) {
        if ($supplier_upstream = "") { return 404; }

        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Requested-With, X-Encrypted' always;
        add_header Access-Control-Max-Age 86400 always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=api_limit burst=60 nodelay;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://$supplier_upstream;
    }

    # ---------- 支付回调:/api/v1/payment/callback/{channel} ----------
    location /api/v1/payment/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_pass http://payment_service;
    }

    location / {
        return 404;
    }
}
